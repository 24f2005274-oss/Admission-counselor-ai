[project]
name = "admission-counselor-ai"
version = "0.1.0"
description = "AI Admission Counselor — Voice agent for West Bengal + India college admissions"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents[silero,openai,deepgram,turn-detector]>=1.0",
    "livekit-plugins-noise-cancellation>=0.2",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "sarvamai>=0.1.28",
    "pydub>=0.25.1",
    "aiohttp>=3.13.5",
]

[project.scripts]
admission-counselor = "src.admission_counselor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
